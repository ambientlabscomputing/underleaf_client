syntax = "proto3";

package raft;

option go_package = "github.com/ambientlabscomputing/underleaf_client/internal/raft/proto";

// RaftTransport defines the gRPC service for Raft node-to-node communication.
// This implements the core Raft consensus protocol RPCs.
service RaftTransport {
  // AppendEntries is used by the leader to replicate log entries and provide heartbeats.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  
  // RequestVote is used by candidates to gather votes during elections.
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  
  // InstallSnapshot is used by the leader to send a snapshot to a follower.
  rpc InstallSnapshot(stream InstallSnapshotRequest) returns (InstallSnapshotResponse);
  
  // TimeoutNow is used to trigger an immediate election timeout.
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

// AppendEntriesRequest is sent by the leader to replicate log entries and heartbeat.
message AppendEntriesRequest {
  // Term is the leader's term.
  uint64 term = 1;
  
  // Leader is the leader's address.
  bytes leader = 2;
  
  // PrevLogEntry is the index of the log entry immediately preceding new ones.
  uint64 prev_log_entry = 3;
  
  // PrevLogTerm is the term of prev_log_entry.
  uint64 prev_log_term = 4;
  
  // Entries are log entries to store (empty for heartbeat).
  repeated LogEntry entries = 5;
  
  // LeaderCommitIndex is the leader's commit index.
  uint64 leader_commit_index = 6;
}

// AppendEntriesResponse is the response to AppendEntriesRequest.
message AppendEntriesResponse {
  // Term is the current term, for leader to update itself.
  uint64 term = 1;
  
  // LastLog is the index of the last log entry.
  uint64 last_log = 2;
  
  // Success is true if follower contained entry matching prev_log_entry and prev_log_term.
  bool success = 3;
  
  // NoRetryBackoff is true if the follower doesn't want to retry immediately.
  bool no_retry_backoff = 4;
}

// RequestVoteRequest is sent by candidates to gather votes.
message RequestVoteRequest {
  // Term is the candidate's term.
  uint64 term = 1;
  
  // Candidate is the candidate requesting vote.
  bytes candidate = 2;
  
  // LastLogIndex is the index of candidate's last log entry.
  uint64 last_log_index = 3;
  
  // LastLogTerm is the term of candidate's last log entry.
  uint64 last_log_term = 4;
  
  // LeadershipTransfer indicates if this is part of a leadership transfer.
  bool leadership_transfer = 5;
}

// RequestVoteResponse is the response to RequestVoteRequest.
message RequestVoteResponse {
  // Term is the current term, for candidate to update itself.
  uint64 term = 1;
  
  // Granted is true if the candidate received the vote.
  bool granted = 2;
}

// InstallSnapshotRequest is sent by the leader to send a snapshot to a follower.
message InstallSnapshotRequest {
  // Term is the leader's term.
  uint64 term = 1;
  
  // Leader is the leader's address.
  bytes leader = 2;
  
  // LastLogIndex is the snapshot's last included index.
  uint64 last_log_index = 3;
  
  // LastLogTerm is the snapshot's last included term.
  uint64 last_log_term = 4;
  
  // Configuration is the cluster configuration at last_log_index.
  bytes configuration = 5;
  
  // ConfigurationIndex is the index of the configuration.
  uint64 configuration_index = 6;
  
  // Size is the total size of the snapshot.
  int64 size = 7;
  
  // Data is a chunk of snapshot data.
  bytes data = 8;
}

// InstallSnapshotResponse is the response to InstallSnapshotRequest.
message InstallSnapshotResponse {
  // Term is the current term, for leader to update itself.
  uint64 term = 1;
  
  // Success is true if the snapshot was successfully installed.
  bool success = 2;
}

// TimeoutNowRequest triggers an immediate election timeout.
message TimeoutNowRequest {}

// TimeoutNowResponse is the response to TimeoutNowRequest.
message TimeoutNowResponse {}

// LogEntry represents a single entry in the Raft log.
message LogEntry {
  // Index is the log entry index.
  uint64 index = 1;
  
  // Term is the term when the entry was received.
  uint64 term = 2;
  
  // Type is the log entry type.
  LogType type = 3;
  
  // Data is the log entry data.
  bytes data = 4;
  
  // Extensions for protocol extensions (not used in base Raft).
  bytes extensions = 5;
}

// LogType represents the type of log entry.
enum LogType {
  // LOG_COMMAND is a normal command.
  LOG_COMMAND = 0;
  
  // LOG_NOOP is a no-op entry (used for leadership assertion).
  LOG_NOOP = 1;
  
  // LOG_ADD_PEER adds a peer.
  LOG_ADD_PEER = 2;
  
  // LOG_REMOVE_PEER removes a peer.
  LOG_REMOVE_PEER = 3;
  
  // LOG_BARRIER is a barrier.
  LOG_BARRIER = 4;
  
  // LOG_CONFIGURATION is a configuration change.
  LOG_CONFIGURATION = 5;
}
