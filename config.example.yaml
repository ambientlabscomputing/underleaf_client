# Underleaf Client Configuration Example
# Copy this file to config.yaml and update with your values
# Location: ~/.underleaf/config.yaml or ./config.yaml

version: 0.0.0

payload:
  # Control Plane API Configuration
  api:
    base_url: http://localhost:8080/api/v1
    # Use HTTPS in production:
    # base_url: https://api.underleaf.example.com/api/v1

  # Authentication Configuration
  auth:
    # JWT token from authentication
    # Obtain with: ufctl auth
    token: your-jwt-token-here
    # Example token format: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...

  # Event Bus Configuration
  event_bus:
    # WebSocket endpoint for event bus
    endpoint: ws://localhost:9000
    # Use WSS in production:
    # endpoint: wss://eventbus.underleaf.example.com
    
    # How often to commit message offsets (consumer group tracking)
    commit_interval: 5s

  # Local Server Configuration (for agent mode)
  local:
    # Organization context
    organization_id: ""
    organization_name: ""
    
    # Unique identifier for this server
    # Obtain with: ufctl register
    server_id: 00000000-0000-0000-0000-000000000000
    
    # Optional: Server display name
    # name: my-edge-server
    
    # Optional: Server tags for targeting
    # tags:
    #   env: production
    #   region: us-west
    #   role: web

  # Optional: Logging Configuration
  logging:
    level: info  # debug, info, warn, error
    format: json # json, text
    output: stdout # stdout, stderr, or file path

  # Optional: Raft Quorum Cluster Configuration
  # Enable this section to form a KV cluster with other nodes for high availability
  raft:
    # Enable/disable Raft cluster participation
    enabled: false
    
    # Unique identifier for this node in the cluster (required if enabled)
    # Must be unique across all nodes in the cluster
    node_id: node1
    
    # Address and port for Raft peer communication (required if enabled)
    # Format: host:port or IP:port
    # This should be accessible by other cluster nodes
    bind_addr: 0.0.0.0:7946
    
    # Directory for Raft data storage (required if enabled)
    # Stores logs, snapshots, and cluster state
    data_dir: /var/lib/underleaf/raft
    
    # Bootstrap new cluster (optional, default: auto-detect)
    # Set to true for the first node in a new cluster
    # Set to false when joining an existing cluster
    # If omitted, will bootstrap if no peers are specified
    bootstrap: false
    
    # List of peer node addresses to join (optional)
    # Format: ["node_id@host:port", ...]
    # Example: ["node2@10.0.1.2:7946", "node3@10.0.1.3:7946"]
    # Leave empty when bootstrapping the first node
    bootstrap_peers: []
