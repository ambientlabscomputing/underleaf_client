name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/ambientlabscomputing/*
      GONOSUMCHECK: github.com/ambientlabscomputing/*
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Build ufctl
      run: go build -v ./cmd/ufctl

    - name: Build underleaf_agent
      run: go build -v ./cmd/underleaf_agent

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/ambientlabscomputing/*
      GONOSUMCHECK: github.com/ambientlabscomputing/*
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.7.0
        args: --timeout=5m
