name: Development Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  dev-release:
    name: Create Development Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build binaries
      env:
        VERSION: dev-${{ steps.sha.outputs.short }}
        API_BASE_URL: https://api.underleafdev.com/api/v1/servers
        EVENT_BUS_ENDPOINT: wss://events.underleafdev.com/ws
      run: |
        mkdir -p bin
        
        LDFLAGS="-X github.com/ambientlabscomputing/underleaf_client/pkg/version.Version=${VERSION} \
          -X github.com/ambientlabscomputing/underleaf_client/pkg/defaults.APIBaseURL=${API_BASE_URL} \
          -X github.com/ambientlabscomputing/underleaf_client/pkg/defaults.EventBusEndpoint=${EVENT_BUS_ENDPOINT}"
        
        # ufctl - Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/ufctl-linux-amd64 ./cmd/ufctl
        
        # ufctl - Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/ufctl-linux-arm64 ./cmd/ufctl
        
        # ufctl - macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/ufctl-darwin-amd64 ./cmd/ufctl
        
        # ufctl - macOS ARM64 (M1/M2/M3)
        GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/ufctl-darwin-arm64 ./cmd/ufctl
        
        # ufctl - Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/ufctl-windows-amd64.exe ./cmd/ufctl
        
        # underleaf_agent - Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/underleaf_agent-linux-amd64 ./cmd/underleaf_agent
        
        # underleaf_agent - Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/underleaf_agent-linux-arm64 ./cmd/underleaf_agent
        
        # underleaf_agent - macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/underleaf_agent-darwin-amd64 ./cmd/underleaf_agent
        
        # underleaf_agent - macOS ARM64 (M1/M2/M3)
        GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/underleaf_agent-darwin-arm64 ./cmd/underleaf_agent
        
        # underleaf_agent - Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/underleaf_agent-windows-amd64.exe ./cmd/underleaf_agent

    - name: Generate checksums
      run: |
        cd bin
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Delete existing dev release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete dev --yes || true
        git push origin :refs/tags/dev || true

    - name: Create Development Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: dev
        name: Development Build (Latest)
        prerelease: true
        files: |
          bin/*
        body: |
          # Underleaf Client - Development Build
          
          **⚠️ This is an automated development build from the `develop` branch**
          
          - Version: `dev-${{ steps.sha.outputs.short }}`
          - Commit: ${{ github.sha }}
          - Built: ${{ github.event.head_commit.timestamp }}
          - Environment: **Development** (underleafdev.com)
          
          This build is configured to connect to the development environment:
          - API: `https://api.underleafdev.com/api/v1/servers`
          - Event Bus: `wss://events.underleafdev.com/ws`
          
          ## Installation
          
          Download the appropriate binary for your platform and make it executable:
          
          ```bash
          # macOS ARM64 (M1/M2/M3)
          curl -L https://github.com/ambientlabscomputing/underleaf_client/releases/download/dev/ufctl-darwin-arm64 -o ufctl
          chmod +x ufctl
          sudo mv ufctl /usr/local/bin/
          
          # Linux AMD64
          curl -L https://github.com/ambientlabscomputing/underleaf_client/releases/download/dev/ufctl-linux-amd64 -o ufctl
          chmod +x ufctl
          sudo mv ufctl /usr/local/bin/
          ```
          
          ## What's Included
          
          - **ufctl**: CLI tool for managing Underleaf servers
          - **underleaf_agent**: Agent binary for server monitoring
          
          For production releases, use version tags (e.g., `v1.0.0`).
